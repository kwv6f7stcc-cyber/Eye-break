<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20-20-20 Eye Break</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif&display=swap">
<style>
:root{--bg:#000;--ink:#F2F2F2;--mute:#8C8C8C;--accent:#4FC3D6;--track:#1E1E1E;--sun:#FFB347;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
body[data-phase="break"]{--accent:var(--sun)}
main{max-width:420px;margin:0 auto;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:2rem;margin:8px 0 0;text-align:center;line-height:1.15}
.sub{color:var(--mute);margin:0;text-align:center;font-size:.95rem;min-height:2.8em;max-width:34ch}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .t{stroke:var(--track)}
.ring .p{stroke:var(--accent)}
.read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.time{font-family:"Instrument Serif",Georgia,serif;font-size:4.2rem;line-height:1;font-variant-numeric:tabular-nums}
.time.sm{font-size:2.4rem}
.lbl{color:var(--mute);font-size:.9rem;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--ink);padding:11px 20px;min-height:44px}
button.main{background:var(--accent);color:var(--bg);font-weight:700}
button[aria-pressed="true"]{background:var(--track)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input[type=time]{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--track);border-radius:12px;padding:8px 10px;min-height:44px}
.set{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;border-top:1px solid var(--track);padding-top:18px}
.set span{color:var(--mute);font-size:.85rem}
.stat{color:var(--mute);font-size:.9rem;text-align:center}
.stat b{color:var(--ink)}
.fine{color:var(--mute);font-size:.8rem;text-align:center;max-width:36ch;margin:0}
.note{color:var(--sun);font-size:.85rem;text-align:center;max-width:36ch;margin:0;min-height:1.2em}
.alert{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.alert[hidden]{display:none}
.alert h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:2.4rem;margin:0 0 8px;color:var(--sun)}
.alert p{color:var(--mute);margin:0 0 18px;max-width:30ch}
.alert .time{margin-bottom:24px}
</style>
</head>
<body data-phase="work">
<main>
  <h1 id="h">Eye break</h1>
  <p class="sub" id="sub"></p>
  <div class="ring" role="timer" aria-live="off">
    <svg viewBox="0 0 200 200"><circle class="t" cx="100" cy="100" r="90"/><circle class="p" id="p" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="0"/></svg>
    <div class="read"><div class="time" id="time">--:--</div><div class="lbl" id="lbl"></div></div>
  </div>
  <div class="row">
    <button class="main" id="ntf">Turn on notifications</button>
    <button id="pause">Pause reminders</button>
    <button id="test">Test alert</button>
  </div>
  <div class="set">
    <span>Remind me every</span>
    <div class="row" id="iv"></div>
    <span>Between</span>
    <div class="row"><input type="time" id="st" aria-label="Start time"><span>and</span><input type="time" id="en" aria-label="End time"></div>
    <button id="snd" aria-pressed="true">Sound on</button>
  </div>
  <p class="note" id="note" role="status"></p>
  <div class="stat" id="stat"></div>
  <p class="fine">Reminders fire on the clock (:00, :20, :40) while this tab is open, even in the background. Pin the tab so you don’t close it. A web page can’t send alerts after it’s closed.</p>
</main>
<div class="alert" id="alert" role="alertdialog" aria-label="Eye break" hidden>
  <div><h2>Look 20 feet away</h2><p>Find something far away and blink slowly.</p><div class="time" id="atime">00:20</div><button class="main" id="adm">Dismiss</button></div>
</div>
<script>
(function(){
var BREAK=20;
function ld(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var iv=ld('iv',20),st=ld('st','09:00'),en=ld('en','18:00'),sound=ld('sound',true),notify=ld('notify',false),paused=false,lastFired=0,actx=null,lastNote=null,testUntil=0,dismissed=0;
var stats=ld('stats',{});
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function count(){return stats[dayKey()]||0}
function prune(){var ks=Object.keys(stats);if(ks.length>7){ks.slice(0,ks.length-7).forEach(function(k){delete stats[k]})}}
try{if('Notification' in window&&Notification.permission==='granted'&&!notify){notify=true;sv('notify',true)}}catch(e){}

function mins(s){var p=(s||'0:0').split(':');return (+p[0])*60+(+p[1]||0)}
function
